[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-sound-ml-reproducibility"
version = "0.1.0"
description = "Reproducible signal-processing and ML pipeline for heart-sound classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
